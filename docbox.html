<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Infinity DocBox Elite</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
    .watermark {
    position: fixed;
    bottom: 15px;
    right: 15px;
    font-size: 10px;
    font-weight: 800;
    color: var(--accent);
    background: rgba(255, 255, 255, 0.05);
    padding: 6px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    backdrop-filter: blur(5px);
    letter-spacing: 1px;
    text-transform: uppercase;
    z-index: 500;
    pointer-events: none; /* Allows you to click things 'behind' the text */
    opacity: 0.6;
    font-family: 'Syncopate', sans-serif;
}

        :root {
            --bg: #050505;
            --accent: #00f2fe;
            --accent-dim: #4facfe;
            --card-glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
            --text: #ffffff;
        }

        * { box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--bg);
            background-image: radial-gradient(circle at 50% 0%, #1a1a2e 0%, #050505 100%);
            color: var(--text);
            min-height: 100vh;
            margin: 0;
            padding: 100px 0 40px 0;
            overflow-x: hidden;
        }

        /* 3D Floating Header */
        header { 
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 500px; height: 70px; 
            background: rgba(10, 10, 10, 0.8); backdrop-filter: blur(20px);
            border: 1px solid var(--border); border-radius: 25px;
            display: flex; justify-content: space-between; align-items: center; 
            padding: 0 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.6); z-index: 1000;
        }

        h1 { font-family: 'Syncopate', sans-serif; font-size: 14px; letter-spacing: 3px; background: linear-gradient(90deg, #fff, var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* Buttons: Advanced 3D Neumorphism */
        .btn-icon {
            border: none; border-radius: 15px; background: rgba(255,255,255,0.05);
            color: white; cursor: pointer; width: 45px; height: 45px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3); transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .btn-icon:active { transform: scale(0.9) translateY(4px); }

        /* Dashboard & Infinity Cards */
        #dashboard { padding: 0 20px; perspective: 1200px; }
        .doc-card { 
            background: var(--card-glass); padding: 25px; border-radius: 30px;
            border: 1px solid var(--border); margin-bottom: 20px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: cardEntrance 0.7s ease-out; transform-style: preserve-3d;
            transition: 0.4s;
        }
        .doc-card:hover { border-color: var(--accent); transform: scale(1.02) rotateX(2deg); background: rgba(255,255,255,0.06); }
        
        @keyframes cardEntrance { from { opacity: 0; transform: translateY(50px) rotateX(-20deg); } to { opacity: 1; transform: translateY(0) rotateX(0); } }

        /* Selector Styling Fix (White BG, Black Text) */
        select {
            width: 100%; padding: 15px; border-radius: 15px; border: 1px solid var(--border);
            background-color: white !important; color: black !important;
            font-size: 16px; font-weight: 600; appearance: none; cursor: pointer;
        }
        option { background-color: white !important; color: black !important; }

        /* Modal: Futuristic Overlay */
        .modal { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #000; z-index: 2000; overflow-y: auto; padding-top: 90px;
        }
        .modal-content { padding: 25px; max-width: 600px; margin: auto; animation: modalBlur 0.4s ease; }
        @keyframes modalBlur { from { filter: blur(10px); opacity: 0; } to { filter: blur(0); opacity: 1; } }

        /* Form Inputs */
        .form-group { margin-bottom: 25px; }
        label { font-size: 11px; color: var(--accent); font-weight: 800; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 10px; display: block; }
        input[type="text"], input[type="number"], input[type="file"] { 
            width: 100%; padding: 16px; border-radius: 18px; border: 1px solid var(--border);
            background: rgba(255,255,255,0.05); color: white; font-size: 16px; transition: 0.3s;
        }
        input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 20px rgba(0, 242, 254, 0.2); }

        .btn-main { 
            background: linear-gradient(135deg, var(--accent-dim), var(--accent));
            color: #000; width: 100%; padding: 20px; border-radius: 20px;
            font-weight: 800; font-size: 15px; border: none; margin-top: 30px;
            box-shadow: 0 10px 30px rgba(0, 242, 254, 0.3); cursor: pointer;
            transition: 0.2s;
        }
        .btn-main:active { transform: scale(0.98); opacity: 0.9; }

        /* Image Display Cards */
        .img-grid { display: grid; gap: 20px; margin-top: 20px; }
        .img-card { 
            background: rgba(255,255,255,0.03); border-radius: 25px; padding: 15px; 
            border: 1px solid var(--border); text-align: center;
        }
        .img-card img { width: 100%; border-radius: 20px; height: 250px; object-fit: cover; }

        .edit-controls { display: none; gap: 10px; }
        .edit-mode .edit-controls { display: flex; }

        .sync-btn { background: #4ade80 !important; color: #000 !important; font-weight: 800; }
    </style>
</head>
<body>

    <header>
        <button class="btn-icon" onclick="toggleEditMode()" id="editBtn">⚙️</button>
        <h1>INFINITY DOCS</h1>
        <div style="display:flex; gap:10px;">
            <button class="btn-icon sync-btn" onclick="openSyncMenu()">☁️</button>
            <button class="btn-icon" style="color:var(--accent); font-size:24px;" onclick="openForm()">+</button>
        </div>
    </header>

    <main id="dashboard"></main>

    <div id="formModal" class="modal">
        <div style="position:fixed; top:20px; width:100%; display:flex; justify-content:center; padding:0 20px; z-index:2001;">
            <button class="btn-icon" style="width:auto; padding:0 20px;" onclick="closeModal('formModal')">✕ CLOSE</button>
        </div>
        <div class="modal-content">
            <input type="hidden" id="docId">
            <div class="form-group"><label>Main Title</label><input type="text" id="mainName" oninput="syncFields()"></div>
            <div class="form-group"><label>Year</label><input type="number" id="mainYear" oninput="syncFields()"></div>
            <div class="form-group"><label>Board/University</label><input type="text" id="mainBoard" oninput="syncFields()"></div>
            <div class="form-group"><label>Total Marks</label><input type="number" id="mainTotal"></div>
            <div class="form-group"><label>Marks Scored</label><input type="number" id="mainScored"></div>

            <div class="form-group" style="background:rgba(0,242,254,0.05); padding:20px; border-radius:20px;">
                <label>Additional Information?</label>
                <input type="text" id="customQ" placeholder="e.g. Roll Number / Subject" oninput="toggleCustomAns()">
                <div id="customAnsBox" style="display:none; margin-top:15px;">
                    <label>Response</label>
                    <input type="text" id="customA">
                </div>
            </div>

            <div class="form-group">
                <label>Sub Documents?</label>
                <select id="hasSub" onchange="toggleSubSection()">
                    <option value="No">No</option>
                    <option value="Yes">Yes</option>
                </select>
            </div>

            <div id="subSection" style="display:none">
                <label>Count (1-9)</label>
                <select id="subCount" onchange="generateSubs()"></select>
                <div id="subWrapper" style="margin-top:20px;"></div>
            </div>

            <div class="form-group">
                <label>Media Assets</label>
                <input type="file" id="imgInp" multiple accept="image/*" onchange="handleImageUpload(this)">
                <div id="imgPreview" class="img-grid"></div>
            </div>

            <button class="btn-main" onclick="saveToIndexedDB()">SAVE TO SECURE STORAGE</button>
        </div>
    </div>

    <div id="viewModal" class="modal">
        <div style="position:fixed; top:20px; width:100%; display:flex; justify-content:center; padding:0 20px; z-index:2001;">
            <button class="btn-icon" style="width:auto; padding:0 20px;" onclick="closeModal('viewModal')">← BACK</button>
        </div>
        <div class="modal-content" id="viewBody"></div>
    </div>

    <div id="syncModal" class="modal">
        <div class="modal-content" style="text-align:center;">
            <h2 style="color:var(--accent);">VAULT CLOUD SYNC</h2>
            <p style="opacity:0.6; font-size:14px; margin-bottom:30px;">Backup your entire Infinity database into a portable file to sync across devices.</p>
            
            <button class="btn-main" onclick="exportData()">📤 EXPORT DATA VAULT</button>
            <div style="margin: 30px 0; height:1px; background:var(--border);"></div>
            <label>Restore / Import Data</label>
            <input type="file" id="importInp" accept=".json" onchange="importData(this)">
            
            <button class="btn-icon" style="width:100%; margin-top:40px; border-radius:15px;" onclick="closeModal('syncModal')">CANCEL</button>
        </div>
    </div>

    <script>
        let db;
        const request = indexedDB.open("InfinityVaultDB", 1);

        request.onupgradeneeded = e => {
            db = e.target.result;
            db.createObjectStore("docs", { keyPath: "id" });
        };
        request.onsuccess = e => {
            db = e.target.result;
            loadDashboard();
        };

        let editMode = false;
        let imagesArray = [];
        const roman = ["I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX"];

        window.onload = () => {
            const sc = document.getElementById('subCount');
            for(let i=1; i<=9; i++) sc.options.add(new Option(i, i));
        };

        function toggleEditMode() {
            editMode = !editMode;
            document.getElementById('dashboard').classList.toggle('edit-mode', editMode);
            document.getElementById('editBtn').style.background = editMode ? 'var(--accent)' : 'rgba(255,255,255,0.05)';
        }

        function toggleCustomAns() {
            const val = document.getElementById('customQ').value.trim();
            document.getElementById('customAnsBox').style.display = val ? 'block' : 'none';
        }

        function toggleSubSection() {
            const isYes = document.getElementById('hasSub').value === 'Yes';
            document.getElementById('subSection').style.display = isYes ? 'block' : 'none';
            if(isYes) generateSubs();
        }

        function generateSubs() {
            const count = document.getElementById('subCount').value;
            const mainName = document.getElementById('mainName').value;
            const mainBoard = document.getElementById('mainBoard').value;
            const mainYear = document.getElementById('mainYear').value;
            const wrap = document.getElementById('subWrapper');
            wrap.innerHTML = '';
            for(let i=0; i<count; i++) {
                wrap.innerHTML += `
                <div style="background:rgba(255,255,255,0.03); padding:20px; border-radius:20px; margin-bottom:15px; border:1px solid var(--border);">
                    <label>Sub Document ${i+1}</label>
                    <input type="text" class="s-name" value="${mainName} ${roman[i]}" style="margin-bottom:10px;">
                    <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;">
                        <input type="number" class="s-year" placeholder="Year" value="${mainYear}">
                        <input type="number" class="s-scored" placeholder="Scored">
                        <input type="number" class="s-total" placeholder="Total">
                    </div>
                    <input type="text" class="s-board" value="${mainBoard}" style="margin-top:10px;">
                </div>`;
            }
        }

        function syncFields() {
            const n = document.getElementById('mainName').value;
            const b = document.getElementById('mainBoard').value;
            const y = document.getElementById('mainYear').value;
            document.querySelectorAll('.s-name').forEach((el, i) => el.value = `${n} ${roman[i]}`);
            document.querySelectorAll('.s-board').forEach(el => el.value = b);
            document.querySelectorAll('.s-year').forEach(el => el.value = y);
        }

        async function handleImageUpload(input) {
            for (let f of input.files) {
                const reader = new FileReader();
                reader.onload = e => {
                    imagesArray.push({ src: e.target.result, title: '' });
                    renderImagePreview();
                };
                reader.readAsDataURL(f);
            }
            input.value = '';
        }

        function renderImagePreview() {
            const cont = document.getElementById('imgPreview');
            cont.innerHTML = '';
            imagesArray.forEach((img, i) => {
                cont.innerHTML += `
                <div class="img-card">
                    <img src="${img.src}">
                    <input type="text" placeholder="Entry Title" value="${img.title}" 
                           oninput="imagesArray[${i}].title = this.value" 
                           style="margin-top:10px; font-size:12px; border:none; background:transparent; text-align:center;">
                    <button onclick="imagesArray.splice(${i},1); renderImagePreview()" style="background:none; border:none; color:red; margin-top:5px; font-weight:800;">REMOVE</button>
                </div>`;
            });
        }

        function saveToIndexedDB() {
            const id = document.getElementById('docId').value || Date.now().toString();
            const subs = [];
            document.querySelectorAll('#subWrapper > div').forEach(el => {
                subs.push({
                    name: el.querySelector('.s-name').value,
                    year: el.querySelector('.s-year').value,
                    scored: el.querySelector('.s-scored').value,
                    total: el.querySelector('.s-total').value,
                    board: el.querySelector('.s-board').value
                });
            });

            const doc = {
                id,
                main: {
                    name: document.getElementById('mainName').value,
                    year: document.getElementById('mainYear').value,
                    board: document.getElementById('mainBoard').value,
                    total: document.getElementById('mainTotal').value,
                    scored: document.getElementById('mainScored').value,
                    q: document.getElementById('customQ').value,
                    a: document.getElementById('customA').value
                },
                subs, images: [...imagesArray]
            };

            const tx = db.transaction("docs", "readwrite");
            tx.objectStore("docs").put(doc);
            tx.oncomplete = () => {
                closeModal('formModal');
                // FORCE PREVIEW MODE ON SAVE
                editMode = false;
                document.getElementById('dashboard').classList.remove('edit-mode');
                document.getElementById('editBtn').style.background = 'rgba(255,255,255,0.05)';
                loadDashboard();
            };
        }

        function loadDashboard() {
            const dash = document.getElementById('dashboard');
            dash.innerHTML = '';
            const tx = db.transaction("docs", "readonly");
            tx.objectStore("docs").openCursor().onsuccess = e => {
                const cursor = e.target.result;
                if(cursor) {
                    const d = cursor.value;
                    dash.innerHTML += `
                    <div class="doc-card" onclick="viewDocument('${d.id}')">
                        <div>
                            <div style="font-size:18px; font-weight:800; color:var(--accent);">${d.main.name || 'UNTITLED'}</div>
                            <div style="font-size:11px; opacity:0.5; margin-top:5px;">${d.main.year || ''} • ${d.images.length} ATTACHMENTS</div>
                        </div>
                        <div class="edit-controls">
                            <button class="btn-icon" style="color:#fbbf24;" onclick="event.stopPropagation(); editDocument('${d.id}')">✏️</button>
                            <button class="btn-icon" style="color:#f87171;" onclick="event.stopPropagation(); deleteDocument('${d.id}')">✕</button>
                        </div>
                    </div>`;
                    cursor.continue();
                }
            };
        }

        function viewDocument(id) {
            if(editMode) return;
            const tx = db.transaction("docs", "readonly");
            tx.objectStore("docs").get(id).onsuccess = e => {
                const d = e.target.result;
                let html = buildViewCard(d.main, 'MASTER RECORD');
                d.subs.forEach(s => html += buildViewCard(s, 'SUB RECORD'));
                
                if(d.images.length > 0) {
                    html += `<h2 style="margin:40px 0 20px 0; font-size:14px; color:var(--accent);">SECURE MEDIA</h2>`;
                    d.images.forEach(img => {
                        html += `
                        <div class="img-card">
                            <div style="padding:10px; font-weight:800; font-size:12px;">${img.title || 'PAGE ENTRY'}</div>
                            <img src="${img.src}">
                            <button class="btn-main" style="margin-top:10px; padding:12px; font-size:12px;" onclick="shareImage('${img.src}')">SHARE TO WHATSAPP</button>
                        </div>`;
                    });
                    html += `<button class="btn-main" style="background:#fff; color:#000;" onclick="sharePDF('${d.id}')">SHARE ALL AS PDF</button>`;
                }
                document.getElementById('viewBody').innerHTML = html;
                document.getElementById('viewModal').style.display = 'block';
            };
        }

        function buildViewCard(data, type) {
            let body = '';
            if(data.year) body += `<div style="display:flex; justify-content:space-between; margin-bottom:10px;"><span>YEAR</span><span style="color:var(--accent)">${data.year}</span></div>`;
            if(data.scored && data.total) {
                const p = ((data.scored * 100) / data.total).toFixed(2);
                body += `<div style="display:flex; justify-content:space-between; margin-bottom:10px;"><span>RESULT</span><span style="color:#4ade80">${data.scored}/${data.total} (${p}%)</span></div>`;
            }
            // MODIFIED: Ensure Board shows even if inherited
            if(data.board) body += `<div style="display:flex; justify-content:space-between; margin-bottom:10px;"><span>BOARD</span><span style="color:var(--accent)">${data.board}</span></div>`;
            
            if(data.q && data.a) body += `<div style="display:flex; justify-content:space-between; margin-bottom:10px;"><span>${data.q.toUpperCase()}</span><span style="color:var(--accent)">${data.a}</span></div>`;

            if(!body && !data.name) return '';
            return `
            <div style="background:rgba(255,255,255,0.03); border-radius:25px; padding:25px; margin-bottom:20px; border:1px solid var(--border);">
                <small style="color:var(--accent-dim); font-weight:900; letter-spacing:1px;">${type}</small>
                <h3 style="margin:10px 0 20px 0;">${data.name || 'NO TITLE'}</h3>
                <div style="font-size:14px;">${body}</div>
            </div>`;
        }

        async function shareImage(src) {
            const b = await (await fetch(src)).blob();
            const f = new File([b], "image.jpg", { type: "image/jpeg" });
            if (navigator.share) navigator.share({ files: [f] });
        }

        async function sharePDF(id) {
            const tx = db.transaction("docs", "readonly");
            tx.objectStore("docs").get(id).onsuccess = async e => {
                const d = e.target.result;
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF();
                d.images.forEach((img, i) => {
                    if(i > 0) pdf.addPage();
                    pdf.addImage(img.src, 'JPEG', 10, 20, 180, 150);
                });
                const b64 = pdf.output('datauristring');
                const b = await (await fetch(b64)).blob();
                const f = new File([b], `${d.main.name}.pdf`, { type: "application/pdf" });
                if (navigator.share) navigator.share({ files: [f] });
            };
        }

        function editDocument(id) {
            const tx = db.transaction("docs", "readonly");
            tx.objectStore("docs").get(id).onsuccess = e => {
                const d = e.target.result;
                openForm(id);
                document.getElementById('mainName').value = d.main.name;
                document.getElementById('mainYear').value = d.main.year;
                document.getElementById('mainBoard').value = d.main.board;
                document.getElementById('mainTotal').value = d.main.total;
                document.getElementById('mainScored').value = d.main.scored;
                document.getElementById('customQ').value = d.main.q || '';
                document.getElementById('customA').value = d.main.a || '';
                toggleCustomAns();
                
                if(d.subs && d.subs.length > 0) {
                    document.getElementById('hasSub').value = 'Yes';
                    document.getElementById('subCount').value = d.subs.length;
                    toggleSubSection();
                    const subFields = document.querySelectorAll('#subWrapper > div');
                    d.subs.forEach((s, i) => {
                        subFields[i].querySelector('.s-name').value = s.name;
                        subFields[i].querySelector('.s-year').value = s.year;
                        subFields[i].querySelector('.s-scored').value = s.scored;
                        subFields[i].querySelector('.s-total').value = s.total;
                        subFields[i].querySelector('.s-board').value = s.board;
                    });
                }

                imagesArray = [...d.images];
                renderImagePreview();
            };
        }

        function deleteDocument(id) {
            if(confirm("DESTROY THIS RECORD FOREVER?")) {
                const tx = db.transaction("docs", "readwrite");
                tx.objectStore("docs").delete(id);
                tx.oncomplete = () => loadDashboard();
            }
        }

        function openSyncMenu() { document.getElementById('syncModal').style.display = 'block'; }

        function exportData() {
            const tx = db.transaction("docs", "readonly");
            const data = [];
            tx.objectStore("docs").openCursor().onsuccess = e => {
                const cursor = e.target.result;
                if(cursor) { data.push(cursor.value); cursor.continue(); }
                else {
                    const blob = new Blob([JSON.stringify(data)], { type: "application/json" });
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = `DocBox_Vault_${Date.now()}.json`;
                    a.click();
                }
            };
        }

        function importData(input) {
            const reader = new FileReader();
            reader.onload = e => {
                const imported = JSON.parse(e.target.result);
                const tx = db.transaction("docs", "readwrite");
                const store = tx.objectStore("docs");
                imported.forEach(item => store.put(item));
                tx.oncomplete = () => {
                    alert("Vault Restored Successfully!");
                    closeModal('syncModal');
                    loadDashboard();
                };
            };
            reader.readAsText(input.files[0]);
        }

        function openForm(id = null) {
            resetForm();
            if(id) document.getElementById('docId').value = id;
            document.getElementById('formModal').style.display = 'block';
        }

        function closeModal(m) { document.getElementById(m).style.display = 'none'; }
        
        function resetForm() {
            document.getElementById('docId').value = '';
            document.querySelectorAll('input').forEach(i => i.value = '');
            document.getElementById('hasSub').value = 'No';
            document.getElementById('subSection').style.display = 'none';
            document.getElementById('customAnsBox').style.display = 'none';
            document.getElementById('subWrapper').innerHTML = '';
            document.getElementById('imgPreview').innerHTML = '';
            imagesArray = [];
        }
    </script>
    <div class="watermark">Created by Sangwan</div>
</body>
</html>
